
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080f1e">

    <title>Request Admin Access | AlongDigital</title>

    <link rel="stylesheet" href="admin-apply.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- HEADER -->

            <header class="auth-header">

                <div class="brand">AlongDigital</div>

                <h1>Request Admin Access</h1>

                <p>
                    Submit your details to request administrator
                    access to our infrastructure.
                </p>

            </header>


            <!-- ADMIN APPLICATION FORM -->

            <form id="adminApplicationForm">

                <div class="form-group">

                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="studentId">Student ID</label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your Student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="dob">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="applicationTerms"
                        required
                    >

                    <label for="applicationTerms">
                        I confirm that all the information
                        provided above is accurate.
                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Application
                </button>

            </form>


            <!-- FOOTER -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <div class="admin-login">

                    <span>Return to registration</span>

                    <a href="index.html">
                        Back to Signup →
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="admin-apply.js"></script>

</body>

</html>
